<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="svGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#svGrad)"/>
  
  <!-- Inner Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8"/>
  
  <!-- Graduation Cap & School Icon -->
  <g transform="translate(256, 230)">
    <!-- Graduation Cap Top Diamond -->
    <path d="M 0 -105 L 145 -35 L 0 35 L -145 -35 Z" fill="#ffffff"/>
    
    <!-- Cap Rim/Shadow Accent -->
    <path d="M 0 -85 L 125 -25 L 0 35 L -125 -25 Z" fill="url(#accentGrad)" opacity="0.25"/>
    
    <!-- Cap Skull Cap Underneath -->
    <path d="M -80 0 L -80 50 C -80 95 80 95 80 50 L 80 0 C 45 22 -45 22 -80 0 Z" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Tassel String & Hanging Ribbon -->
    <path d="M 0 -35 Q 110 -20 120 40 L 120 100" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
    <circle cx="120" cy="105" r="10" fill="#f59e0b"/>
  </g>

  <!-- Open Book Base -->
  <g transform="translate(256, 380)">
    <!-- Left Page -->
    <path d="M -15 -15 C -60 -40 -120 -40 -150 -25 L -150 45 C -120 30 -60 30 -15 55 Z" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Right Page -->
    <path d="M 15 -15 C 60 -40 120 -40 150 -25 L 150 45 C 120 30 60 30 15 55 Z" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Center Spine -->
    <path d="M 0 -20 L 0 60" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
